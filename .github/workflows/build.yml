name: Build CosmoNet Reader

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
      - name: Rinomina APK
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/CosmoNetReader-${VERSION}-arm64.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/CosmoNetReader-${VERSION}-arm32.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: build/app/outputs/flutter-apk/CosmoNetReader-*-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-arm32
          path: build/app/outputs/flutter-apk/CosmoNetReader-*-arm32.apk

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Rigenera cartella windows
        run: flutter create --platforms=windows .
        shell: pwsh
      - run: flutter build windows --release
      - name: Installa Inno Setup
        run: choco install innosetup -y
      - name: Crea installer.iss
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          @"
          [Setup]
          AppName=CosmoNet Reader
          AppVersion=$version
          AppPublisher=cosmonet.info
          AppPublisherURL=https://www.cosmonet.info
          DefaultDirName={autopf}\CosmoNet Reader
          DefaultGroupName=CosmoNet Reader
          OutputBaseFilename=CosmoNetReader-$version-Setup
          OutputDir=output
          Compression=lzma
          SolidCompression=yes

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs

          [Icons]
          Name: "{group}\CosmoNet Reader"; Filename: "{app}\cosmonet_reader.exe"
          Name: "{commondesktop}\CosmoNet Reader"; Filename: "{app}\cosmonet_reader.exe"

          [Run]
          Filename: "{app}\cosmonet_reader.exe"; Description: "Avvia CosmoNet Reader"; Flags: postinstall
          "@ | Out-File -FilePath installer.iss -Encoding UTF8
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: output\CosmoNetReader-*-Setup.exe

  release:
    name: Pubblica Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: "CosmoNet Reader ${{ github.ref_name }}"
          body: |
            ## CosmoNet Reader ${{ github.ref_name }}
            | File | Piattaforma |
            |------|-------------|
            | `CosmoNetReader-*-arm64.apk` | Android moderni |
            | `CosmoNetReader-*-arm32.apk` | Android vecchi |
            | `CosmoNetReader-*-Setup.exe` | Windows 10/11 |
            🌐 [cosmonet.info](https://www.cosmonet.info)
          files: artifacts/*
